#Greatsword wide sweep (combat/HeavyWeapons)
[wideSweep]
	#Ticks to charge before it can be let go
	# Default: 15
	# Range: 1 ~ 200
	charge = 15
	#How far round each side it cuts
	# Default: 90.0
	# Range: 10.0 ~ 180.0
	degrees = 90.0
	#How far it throws them
	# Default: 0.5
	# Range: 0.0 ~ 5.0
	knockback = 0.5
	#Ticks before the next
	# Default: 80
	# Range: 0 ~ 1200
	cooldown = 80
	#Exhaustion per sweep
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	hunger = 1.0
	#Durability lost: one per thing struck, up to this
	# Default: 3
	# Range: 1 ~ 100
	maxWear = 3

#A helmet's visor (combat/Visors)
[visor]
	#How much less damage a projectile hit to the head from the front does to a wearer with a visor (0 none, 1 all of it)
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	frontHeadProjectileSoften = 0.3
